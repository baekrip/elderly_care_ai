# ===================================================
# Jetson Orin Nano local Edge Hub config
# 실행: python -m server.main --config server/config.orin.yaml --host 0.0.0.0 --port 8000
# ===================================================

app:
  name: "elderly-care-orin-edge-hub"

patient:
  patient_id: "P001"

database:
  url: "sqlite+aiosqlite:///server/storage/orin_local_server.db?timeout=30"

storage:
  results_dir: "server/storage/results"
  video_dir: "server/storage/videos"
  clip_json_dir: "server/storage/results/clip_json"

events:
  fall_only_mode: true  # [TEMP] 낙상+정상 외 이벤트 억제. 복구: false
  normal_heartbeat_interval_sec: 2.0
  default_pre_clip_ms: 90000
  default_post_clip_ms: 90000
  confirm_after_ms: 30000
  resolve_after_ms: 5000
  clip_storage_policy: "segment_ring"
  danger_labels:
    - "DROP"
    - "FALL"
    - "GRADUAL_FALL"
    - "GRADUAL_COLLAPSE"
    - "LOSS_OF_BALANCE"
    - "POST_FALL_IMMOBILITY"

streams:
  enabled: true

stgcn:
  model_path: "server/models/stgcn_fall_binary.onnx"
  device: "cuda"
  backend: "onnxruntime"
  precision: "fp16"
  window_ms: 5000
  min_window_frames: 8

tier_classification:
  enabled: true
  model_path: "edge/models/xgboost_tier_multiclass.json"
  meta_path: "experiments/behavior_training/reports/xgboost_tier_multiclass_meta.json"
  confidence_threshold: 0.55
  window_frames: 12
  min_history_frames: 4
  default_label: "NORMAL"

model_fusion:
  enabled: true
  stgcn_stride_ms: 1000
  stgcn_prefilter_min_xgboost_probability: 0.0
  stgcn_weight: 0.6
  xgboost_weight: 0.4
  decision_threshold: 0.65

risk_features:
  running_speed_threshold_px_s: 140.0
  danger_speed_threshold_px_s: 260.0
  collision_overlap_threshold: 0.35
  collision_jerk_threshold: 180.0
  collision_pose_delta_threshold: 20.0
  collision_instability_threshold: 10.0
  collision_bbox_area_change_threshold: 0.25
  fall_motion_velocity_threshold_px_s: 50.0
  fall_motion_bbox_area_change_threshold: 0.15
  fall_motion_pose_delta_threshold: 10.0
  static_threshold_ms: 30000.0
  fall_torso_delta_threshold: 35.0
  fall_head_drop_threshold: 0.05
  floor_roi_lying_threshold: 0.4
  floor_inactivity_threshold_ms: 60000.0
  pose_lost_threshold_ms: 10000.0
  low_confidence_threshold: 0.15
  min_rule_pose_confidence: 0.20
  min_rule_visible_joint_ratio: 0.30
  lying_bbox_aspect_ratio_threshold: 1.20
  lying_static_duration_ms: 500.0

risk_smoothing:
  alpha: 0.3
  suspicious_threshold: 0.45
  danger_threshold: 0.65
  vote_window: 10

local_archive:
  enabled: true
  save_dir: "server/storage/results"
  rotation:
    enabled: true
    subdir: "daily"
    retention_days: 7
  candidate_requests_file: "candidate_requests.jsonl"
  stgcn_results_file: "stgcn_results.jsonl"
  pattern_results_file: "pattern_results.jsonl"
  clip_json_dir: "clip_json"
  clip_requests_file: "server_clip_requests.jsonl"
  clip_results_file: "server_clip_results.jsonl"

pattern_analyzer:
  inactivity_threshold_sec: 300
  night_start_hour: 22
  night_end_hour: 6
  pattern_deviation_pct: 30.0
  snapshot:
    enabled: true
    path: "server/storage/results/pattern_state_snapshot.json"
    interval_sec: 60
    max_gap_sec: 300
    max_track_age_sec: 3600
    max_snapshot_size_kb: 512

backend:
  enabled: true
  # BACKEND_BASE_URL and APP_TOKEN override these values at runtime.
  # Do not hardcode live EC2 IP or APP_TOKEN in Git.
  base_url: ""
  device_key: "pi5-home001-cam1"
  token: ""
  events_batch_path: "/api/v1/events/batch"
  alerts_immediate_path: "/api/v1/alerts/immediate"
  batch_interval_sec: 10
  normal_batch_interval_sec: 300
  request_timeout_sec: 10.0
  pending_file: "server/storage/results/backend_pending.jsonl"

ingest_auth:
  enabled: true
  api_key: ""
  api_key_env: "EDGE_INGEST_API_KEY"
  api_key_header: "X-Edge-API-Key"
  device_id_header: "X-Device-ID"
  require_device_id: true

media_server:
  backend_clip_forward_enabled: true
  clip_upload_auth_enabled: true
  clip_upload_api_key: ""
  clip_upload_api_key_env: "CLIP_UPLOAD_API_KEY"
  clip_upload_api_key_header: "X-API-Key"
  face_blur_on_upload: true
  clip_receive_endpoint: null
