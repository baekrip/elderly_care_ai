# 로컬 개발/학습 전용 구성. 운영(EC2 + systemd + nginx)과 별개다.
#
#   docker compose up --build     # 최초 실행 (DB 스키마 자동 재구성)
#   docker compose down           # 정지
#   docker compose down -v        # DB까지 완전 초기화 (스키마 재적용됨)
#
# 여기 박힌 값들은 전부 로컬 전용 더미다. 운영 .env를 이 파일로 가져오지 말 것 —
# 운영 DATABASE_URL은 서버 기준 localhost라 로컬에선 의미가 없고,
# AWS 키는 clips API 전용이라 모듈화/테스트에는 필요 없다 (미설정 시 503, 정상 동작).

services:
  db:
    # 운영 DB와 동일 메이저: PostgreSQL 14.22 (migrations/001_init.sql 덤프 헤더 기준)
    image: postgres:14
    container_name: capstone-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: capstone_db
      TZ: UTC
    ports:
      # 로컬 psql/DBeaver로 직접 붙어볼 수 있게 열어둔다.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 최초 기동 시(빈 데이터 디렉토리일 때만) 이 스크립트 하나가 실행되고,
      # 그 안에서 /migrations → /seeds 순서로 SQL을 적용한다.
      # 세 경로가 서로 겹치지 않아야 한다 — 중첩 바인드 마운트는 막혀 있다.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migrations:ro
      # 시드를 migrations/ 안에 두지 않는 이유: migrations/ 는 서버에 배포되는
      # 디렉토리라, 더미 데이터가 섞이면 운영 DB에 들어갈 위험이 있다.
      - ./seeds:/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capstone_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: capstone-api
    depends_on:
      db:
        # 스키마 적용이 끝나 DB가 실제로 응답할 때까지 기다린다.
        condition: service_healthy
    environment:
      # host가 localhost가 아니라 서비스명 db — 컨테이너 네트워크 내부 DNS
      DATABASE_URL: postgresql+psycopg://postgres:localdev@db:5432/capstone_db

      # app.py:47에서 없으면 즉시 RuntimeError나는 필수 3종
      # APP_TOKEN은 운영 규약(32자 hex 소문자)만 지킨 더미 값
      APP_TOKEN: 0123456789abcdef0123456789abcdef
      JWT_SECRET: local-only-jwt-secret-do-not-use-in-production

      FLASK_DEBUG: "false"
      PORT: "5000"

      # 빈 값이면 AI2 트리거는 no-op (스케줄러는 그대로 돈다)
      AI2_SERVER_URL: ""

      # 빈 값이면 s3_client=None → clips API가 503 반환 (의도된 동작)
      S3_BUCKET: ""

      TZ: UTC
    ports:
      # 호스트만 5001 — macOS AirPlay Receiver(ControlCenter)가 5000을 점유하기 때문.
      # 컨테이너 내부는 5000 그대로라 운영 설정과 어긋나지 않는다.
      # 접속: http://localhost:5001
      - "5001:5000"
    volumes:
      # 모듈화 작업용 — 로컬에서 파일 쪼개면 컨테이너에 즉시 반영된다.
      # 앞으로 생길 모듈 파일들도 자동으로 들어오게 디렉토리째 마운트.
      - .:/app
    # Dockerfile의 CMD는 운영과 동일하게 유지하고, 개발 편의(--reload)만 여기서 덧댄다.
    # 파일을 저장하면 gunicorn이 알아서 워커를 재시작 → 모듈 쪼개면서 바로바로 확인 가능.
    command: >
      gunicorn -b 0.0.0.0:5000
      -w 2 --worker-class gthread --threads 8
      --timeout 120 --keep-alive 75
      --access-logfile - --reload
      app:app

  # 모듈화 동등성 대조군 — 커밋된 원본 app.py(2,316줄 단일 파일)를 그대로 띄운다.
  # 같은 DB, 같은 gunicorn 옵션, 같은 환경변수. 다른 건 코드 구조뿐이다.
  # tests/test_equivalence.py 가 양쪽에 같은 요청을 던져 응답을 비교한다.
  #
  # working_dir을 /legacy로 두는 이유: gunicorn이 cwd에서 app 모듈을 찾으므로
  # /legacy/app.py 가 `app:app` 으로 잡힌다. 신규 모듈들과 섞이지 않는다.
  #
  # 모듈화 검증이 끝나면 이 서비스와 legacy/ 디렉토리는 지워도 된다.
  api-legacy:
    build: .
    container_name: capstone-api-legacy
    depends_on:
      db:
        condition: service_healthy
    working_dir: /legacy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:localdev@db:5432/capstone_db
      APP_TOKEN: 0123456789abcdef0123456789abcdef
      JWT_SECRET: local-only-jwt-secret-do-not-use-in-production
      FLASK_DEBUG: "false"
      PORT: "5000"
      AI2_SERVER_URL: ""
      S3_BUCKET: ""
      TZ: UTC
    ports:
      - "5002:5000"
    volumes:
      - ./legacy:/legacy
    command: >
      gunicorn -b 0.0.0.0:5000
      -w 2 --worker-class gthread --threads 8
      --timeout 120 --keep-alive 75
      --access-logfile -
      app:app

volumes:
  pgdata:
